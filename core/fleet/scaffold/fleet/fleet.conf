# {{ORG}} fleet configuration. KEY=VALUE lines; '#' starts a comment line; a leading ~ is expanded.
# Read by every `fleet` command. A per-machine override file, ~/.config/{{ORG}}/fleet.local.conf,
# is loaded after this one and wins (use it for paths that differ between hosts).
#
# Every key below (plus FLEET_REPO, FLEET_STATE, ENV_DIR, LOG_DIR, ENGSYS_REF, INSTANCE_REF and
# TMUX_SESSION) is available to fleet/*.tmpl and jobs/launchd/*.tmpl as a double-underscore
# token, for example the PIN_DIR key renders wherever a template writes it between two pairs of
# underscores. A template that names a key that is not set fails to render, so an unset key is
# never silently dropped.

# --- Required ----------------------------------------------------------------------------------
# Slug for machine paths and labels: ~/.config/<org>/, ~/.cache/<org>/,
# ~/Library/Logs/<org>-fleet/, launchd labels com.<org>.fleet.<job>.
FLEET_ORG={{ORG}}
# owner/name of the repo whose .claude/settings.json holds the plugin pins.
PIN_REPO={{PIN_REPO}}
# Local checkout of PIN_REPO. Also the sessions' default working directory.
PIN_DIR={{PIN_DIR}}
# The pinned engsys checkout the host scripts run from (never the plugin cache).
ENGSYS_DIR={{ENGSYS_DIR}}
# Agent harness for fleet sessions: claude (default) | copilot | antigravity.
# HARNESS={{HARNESS}}
# Automatic seat-limit fallback order (comma-separated, e.g. copilot,antigravity). When a monster
# pane hits a seat usage/rate limit, the supervisor forfeits its baton and relaunches on the first
# available fallback harness for QUOTA_COOLDOWN_MIN minutes (default 60) before probing primary.
# HARNESS_FALLBACK=copilot,antigravity
# QUOTA_COOLDOWN_MIN=60

# --- Marketplaces ------------------------------------------------------------------------------
# ENGSYS_MARKETPLACE=engsys
{{#if marketplace}}
# The name of this instance's own marketplace (the plugin in plugin/). `fleet pin` releases it and
# `fleet sync` checks the instance out at its pinned tag.
{{/if}}
{{#unless marketplace}}
# The name of this instance's own marketplace. Empty = no instance plugin: no instance release, and
# the instance checkout is not pinned. Set it (and add .claude-plugin/ + plugin/) to grow one later.
{{/unless}}
INSTANCE_MARKETPLACE={{INSTANCE_MARKETPLACE}}

# --- Host --------------------------------------------------------------------------------------
# Where agent worktrees live; created by `fleet launch` and passed to interactive sessions as --add-dir.
WORKTREES_DIR={{WORKTREES_DIR}}
# GitHub App env file. Set = identity kit on (env-scoped git identity + the gh shim); empty = the
# machine's own git and gh identity. Setup: <engsys>/core/fleet/identity/README.md
GH_APP_ENV={{GH_APP_ENV}}
{{#if azure}}
# Azure service-principal env file (isolated AZURE_CONFIG_DIR + certificate login). Sourced into every
# session by fleet/env/session.env.tmpl and kept fresh by jobs/launchd/az-sp-login.plist.tmpl.
# Setup: <engsys>/stacks/cloud/azure/fleet/README.md
AZURE_SP_ENV={{AZURE_SP_ENV}}
{{/if}}
# A separate Claude Code config dir for fleet sessions (a machine shared with a person's own Claude use),
# with its own login. One-time setup: fleet-guide.md § 6.1. Every fleet session runs with it, `fleet sync`
# installs the plugins into it, and `fleet verify` checks it.
# FLEET_CLAUDE_CONFIG_DIR=~/.config/{{ORG}}/claude
# Which sessions run on it: all (default), or supervised (monsters and the security lane only; the
# interactive roles keep ~/.claude, and fleet sync keeps the pinned plugins in both).
# FLEET_CLAUDE_CONFIG_DIR_SCOPE=supervised
# Or, sharing ~/.claude: user-scope plugins (name@marketplace, space-separated) `fleet verify` accepts in
# fleet sessions. Their hooks run in the monsters, so list only plugins you have decided to allow.
# VERIFY_ALLOWED_USER_PLUGINS=
# Sharing ~/.claude also means its agents, skills, commands, rules, CLAUDE.md and MCP servers load in the
# monsters: `fleet verify` prints a sha256 for each; list only what you have decided to allow.
# VERIFY_ALLOWED_USER_FILES=
# User-scope hooks and settings commands (statusLine, apiKeyHelper, any *Helper / *Command): `fleet verify`
# prints a sha256 over the command and every file it runs; list only what you have decided to allow.
# VERIFY_ALLOWED_USER_HOOKS=

# --- Multi-fleet registry (optional) ------------------------------------------------------------
{{#if fleet}}
# This fleet's id in the federation registry (federation.yml at the instance root): 2-21 characters,
# a lowercase letter then lowercase letters, digits or hyphens. Exported into every session as
# FLEET_ID. Setup: fleet-guide.md "Registry (multi-fleet)".
FLEET_ID={{FLEET_ID}}
{{/if}}
{{#unless fleet}}
# This fleet's id when several fleets work the same repos (docs/multi-fleet.md). Unset = single-fleet
# mode. Setup: fleet-guide.md "Registry (multi-fleet)".
# FLEET_ID=
{{/unless}}
# The registry file, relative to the instance root unless absolute. No file = single-fleet mode.
# FEDERATION_FILE=federation.yml
# The instance repo (owner/name) holding each fleet's status issue, where a fleet's resource broker
# heartbeats. Default: the origin remote of this checkout.
# FLEET_INSTANCE_REPO=

# --- Operator time format (optional) ------------------------------------------------------------
# How dates and times read to a person: everything the fleet says in chat, Slack and comments. A time
# zone (IANA name) and a 12h or 24h clock. Default UTC, 24h. With a federation.yml, set these per fleet
# there instead (fleets.<id>.timezone / .clock). Machine-read timestamps stay ISO 8601 UTC.
# OPERATOR_TIMEZONE=America/New_York
# OPERATOR_CLOCK=12h

# --- fleet notify (optional) --------------------------------------------------------------------
# `fleet notify` posts escalations through the fleet's own Slack bot instead of an operator's
# personal Slack connector. Unset = Slack unconfigured; escalations fall back to a GitHub comment
# on their own. Setup: fleet-guide.md § 6.9.
# SLACK_ENV=~/.config/{{ORG}}/slack.env
# owner/repo#N to comment on when Slack is unconfigured or unreachable. Unset = the message is only
# printed as a warning.
# NOTIFY_FALLBACK_ISSUE=

# --- Pin PRs (`fleet pin`) ---------------------------------------------------------------------
# Review run in the pin PR's worktree, for example: cr review --agent --base origin/main
# Empty = no review run; the ready label is still applied.
# REVIEW_CMD=
# Marker line that opens the review comment, for example: <!-- local-review-findings -->
# REVIEW_MARKER=
# Case-insensitive pattern; a match (or a non-zero exit of REVIEW_CMD) stops auto-labeling.
# REVIEW_BLOCK_REGEX=critical\|warning
# READY_LABEL=mm:ready
# Run in the pin worktree before commit and push, for example: pnpm install --frozen-lockfile --prefer-offline --silent
# PREPUSH_SETUP_CMD=
# PIN_WAIT_MAX_MIN=240

# --- Model policy ------------------------------------------------------------------------------
{{#if harness_claude}}
# Alias pins: persona `model: opus|sonnet|fable|haiku` resolves through these
# (ANTHROPIC_DEFAULT_<TIER>_MODEL in fleet/env/session.env.tmpl).
OPUS_MODEL=claude-opus-5-5
SONNET_MODEL=claude-sonnet-5-5
FABLE_MODEL=claude-fable-5-1
HAIKU_MODEL=claude-haiku-5-5
# The security lane (fleet/env/security.env.tmpl) points the opus and fable aliases here.
SECURITY_MODEL=claude-opus-4-8

# Per-role session model and effort (fleet/roster.tmpl). Effort: low | medium | high | xhigh | max.
# Raise effort before switching to a costlier model.
# Merge orchestration is judgment work: the judgment tier at high effort.
MM_MODEL=claude-opus-5-5
MM_EFFORT=high
# The maintenance monster is the security lane (its env points opus/fable at SECURITY_MODEL): run the
# session itself on the same model — keep this equal to SECURITY_MODEL.
MAINTAIN_MODEL=claude-opus-4-8
MAINTAIN_EFFORT=high
{{#if resource_broker}}
# The resource broker actuates: fast synchronous CLI calls (pump, reconcile, reprovision) and nudge relays.
# Its decisions are mechanical and environment-health decisions stay with the maintenance lane, so the
# judgment tier at low effort is enough (reliable tool use, little thinking).
BROKER_MODEL=claude-opus-5-5
BROKER_EFFORT=low
{{/if}}
# Interactive roles: the judgment tier at its default effort; raise per task.
BUILD_MODEL=claude-opus-5-5
BUILD_EFFORT=medium
INVESTIGATE_MODEL=claude-opus-5-5
INVESTIGATE_EFFORT=medium
DESIGN_MODEL=claude-opus-5-5
DESIGN_EFFORT=medium
{{/if}}
{{#if harness_copilot}}
HARNESS=copilot
# Copilot CLI multi-vendor model catalog (for example: claude-opus-5.5, claude-sonnet-5.5,
# claude-haiku-5.5, gpt-6-astra, gpt-6.1-sol, gpt-6-luna, gemini-4-argon, gemini-3.8-flash).
OPUS_MODEL=claude-opus-5.5
SONNET_MODEL=claude-sonnet-5.5
FABLE_MODEL=claude-opus-5.5
HAIKU_MODEL=claude-haiku-5.5
# The security tier runs on Claude Opus 4.8 on every harness and is never mapped to another model.
# The launcher refuses merge, maintain and security-tier sessions on a non-Claude harness: run the
# monsters and the security lane on HARNESS=claude.
SECURITY_MODEL=claude-opus-4-8

# Per-role session model and reasoning effort (--reasoning-effort low|medium|high|xhigh).
MAINTAIN_MODEL=claude-opus-4-8
MAINTAIN_EFFORT=high
{{#if resource_broker}}
BROKER_MODEL=claude-sonnet-5.5
BROKER_EFFORT=low
{{/if}}
BUILD_MODEL=claude-opus-5.5
BUILD_EFFORT=medium
INVESTIGATE_MODEL=claude-opus-5.5
INVESTIGATE_EFFORT=medium
DESIGN_MODEL=claude-opus-5.5
DESIGN_EFFORT=medium
{{/if}}
{{#if harness_antigravity}}
HARNESS=antigravity
# Antigravity (Gemini) uses Gemini 4 Argon (gemini-4-argon) as the premier model for interactive engineering roles
# (scaling reasoning depth via --effort low|medium|high|max) and Gemini 3.8 Flash (gemini-3.8-flash) for fast probes.
OPUS_MODEL=gemini-4-argon
SONNET_MODEL=gemini-4-argon
FABLE_MODEL=gemini-4-argon
HAIKU_MODEL=gemini-3.8-flash
# The security tier runs on Claude Opus 4.8 on every harness and is never mapped to another model.
# The launcher refuses merge, maintain and security-tier sessions on a non-Claude harness: run the
# monsters and the security lane on HARNESS=claude.
SECURITY_MODEL=claude-opus-4-8

# Per-role session model and thinking effort (--effort low|medium|high|max).
MAINTAIN_MODEL=claude-opus-4-8
MAINTAIN_EFFORT=high
{{#if resource_broker}}
BROKER_MODEL=gemini-3.8-flash
BROKER_EFFORT=low
{{/if}}
BUILD_MODEL=gemini-4-argon
BUILD_EFFORT=medium
INVESTIGATE_MODEL=gemini-4-argon
INVESTIGATE_EFFORT=medium
DESIGN_MODEL=gemini-4-argon
DESIGN_EFFORT=medium
{{/if}}
{{#unless harness_claude}}
# The merge monster runs only on HARNESS=claude (the launcher refuses it on this harness). These keep
# the roster template rendering and take effect only if this fleet runs with HARNESS=claude.
MM_MODEL=claude-opus-5-5
MM_EFFORT=high
{{/unless}}
# Permission mode for the attended (interactive) roles; the monsters run unattended.
INTERACTIVE_PERMISSION_MODE=auto
