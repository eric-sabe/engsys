# Merge Monster per-repo config — copy to .claude/merge-monster.yml (or to
# merge-monster.yml in a fleet config dir outside the repo — see SKILL.md
# § Prerequisites) and edit.
# Read by the model at session start. Scripts take flags; the ones given --config read only the
# keys they name (mm-watch.sh: pulse_max, heartbeat_minutes, stale_lock_minutes, dependabot.auto_merge; mm-tick.sh: heartbeat_minutes, rotate_context_tokens).
# Design spec: docs/merge-monster.md in engsys.

repo: owner/name
default_branch: main
ledger_issue: 0              # printed by scripts/mm-setup.sh --repo owner/name

state_dir: logs/merge-monster # working memory: state.md, journal, .watch/ (keep gitignored)
poll_interval: 30            # seconds — mm-watch.sh cadence (2-4 gh calls/cycle)
heartbeat_minutes: 10        # ScheduleWakeup fallback tick (mm-tick.sh); each tick renews the baton
# pulse_max: 22m             # the keepalive stops renewing after this long with no renew from the model
                             # (a wedged model never keeps the role). Default: 2.25 x heartbeat_minutes,
                             # clamped so the lease lapses before the heartbeat reads stale:
                             #   heartbeat_minutes + 2 < pulse_max <= stale_lock_minutes - 11 - 0.75 x heartbeat_minutes
                             # (needs stale_lock_minutes >= 1.75 x heartbeat_minutes + 13). Minutes, or 22m / 1350s / 1h.
stale_lock_minutes: 45       # heartbeat older than this ⇒ baton is stale, manual merging allowed
# rotate_context_tokens: 175000 # heartbeat asks for rotation past this context size with nothing active (0 = off).
                             # Default: 70% of CLAUDE_CODE_AUTO_COMPACT_WINDOW when set (250k → 175k), else 140k (700k on [1m]);
                             # a value >= CLAUDE_CODE_AUTO_COMPACT_WINDOW is clamped to 70% with a CONFIG_WARNING.

merge_method:
  multi_commit: merge        # batch PRs keep per-issue commits
  single_commit: squash

ready_requirements:
  review_marker: ""          # evidence comment preflight requires on the PR,
                             # e.g. "<!-- review-findings -->" — empty to skip
  signed_security_verdict: false # opt-in (engsys#197, option B; default off, so existing fleets are unchanged).
                             # true: the READY preflight runs with --security-verdict. Verdicts are ranked by
                             # their SIGNED timestamp (never the comment's createdAt, so a re-posted old
                             # verdict changes nothing); the latest authentic one decides. FINDINGS (for ANY
                             # head) fails and is STICKY: a new push does not clear it, only a fresh signed
                             # verdict for the current head does. A PASS counts only when signed for the
                             # current head. Unsigned, forged or tampered `<!-- nyx-review -->` comments are
                             # ignored once an authentic verdict decides and FAIL the preflight when none
                             # does; an unreadable key always fails (fail closed). Needs the fleet to run with
                             # FLEET_SECURITY_VERDICT_KEY=on. Defence in depth, NOT a boundary (the key is
                             # readable by any process of the fleet's OS user); the boundary is a separate
                             # GitHub identity for the security lane (eric-sabe/engsys#220).
  security_verdict_key_file: ""  # absolute path to the verdict key; empty = $FLEET_STATE/security-verdict.key
  sdd_contract: false        # opt-in: true only when this repo's PRs carry SDD
                             # `<!-- engsys:issue-meta -->` contracts; preflight then
                             # runs with --check-contract. Off by default: on a repo
                             # without SDD contracts every PR would fail missing_issue_meta.

# Paths whose PRs need a signed security verdict (engsys#229), decided by mm-preflight.sh itself, which finds this
# file (in-repo, the fleet config dir, $ENGSYS_MM_CONFIG or --config): `*` and `?` stay inside one path segment, `**` crosses segments, `**/x` also matches a root-level `x`;
# everything else is literal, so `app/(auth)/**` and `app/api/auth/[...nextauth]/**` match themselves. Both the old and
# the new path of a rename are matched. Used when ready_requirements.signed_security_verdict is true (or
# the session passes --security-verdict); the label below is checked then too.
security_sensitive_globs:   # a block list; uncomment the examples below
  # - services/dashboard/app/(auth)/**
  # - "**/*.bicep"
security_sensitive_label: security   # a PR carrying this label always needs the verdict
# The label that asks the security lane for a signed verdict (engsys#231). When preflight exits 3
# (security_review_required: the PR needs a verdict and has none), merge-monster adds it and keeps the PR parked; the
# maintenance monster holding the signing key reviews the head with Nyx, posts the signed verdict and removes it; the
# bus and the tick watch it (engsys#241). A request, not a trust signal: removing it never lets a PR through. Must
# differ from security_sensitive_label. The maintenance monster reads it from this file too.
security_review_label: security-review-requested
# Minutes a review request may stand at a PR's head with no signed verdict before the tick escalates it once,
# owner-routed (`fleet notify --level action --author <PR author>`: a fleet App's PR DMs that fleet's operator).
# Escalated at once, whatever this says, when the security lane is clearly unavailable: its self-authored skip
# note or no-signing-key note on the PR, or the maintain baton free or expired. 0 turns it off (engsys#246).
security_review_escalate_minutes: 30

# Globs (against changed files) whose PRs merge early to minimize queue-wide
# rebase churn — lockfiles, CI workflow files, schemas, shared-package APIs.
conflict_magnets: []
  # - pnpm-lock.yaml
  # - .github/workflows/ci.yml

# Globs marking migration-bearing PRs: parked mm:blocked behind a `merge` gate
# that a human approves with a PR review (SKILL.md § Operator gates).
migration_globs: []
  # - services/database/migrations/**

# Full local validation command — the Dependabot auto-merge gate (a Dependabot
# "quick check" badge is NOT full CI). Empty disables all auto-merging.
local_gate: ""
  # e.g. "pnpm install --frozen-lockfile && pnpm build && pnpm test && pnpm lint"

dependabot:
  # Categories eligible for auto-merge after the local gate passes.
  # Majors, runtime deps, Docker bases, engine bumps are NEVER auto.
  # Running a maintenance-monster session as the sole Dependabot owner?
  # Set this to [] so MM never idle-merges a raw Dependabot PR out from
  # under the watchdog — it will arrive back as a triaged mm:ready PR.
  auto_merge: [patch_dev, minor_dev, patch_ci, minor_ci, grouped_patch]

# Escalation posts via `fleet notify` (the fleet's own Slack voice, chmod-600 bot
# token in SLACK_ENV — see fleet-guide.md § Slack); unconfigured/unreachable Slack
# falls back to a ledger-issue comment on its own. Nothing to set here.

# GitHub team (org/team-slug) whose members approve operator gates on GitHub:
# a PR review Approve for merges, `/approve <gate-id>` for other acts. Checked
# live by scripts/gate-check.sh (docs/gate-check.md). Unset → every gate stays
# shut (fail closed). The gh identity needs org Members: read.
operators_team: ""           # e.g. acme/fleet-operators
# For a user-owned repo (no teams): list operators as login:account-id instead
# (id from `gh api users/<login> --jq .id`; matching is by id, so a rename or a
# squatted old login can't change who approves). Used only when operators_team is
# empty; each id is checked live (GET /user/{id} is a User). Neither set → fail
# closed. Use a closed, owner-managed team with no child teams: members of child
# teams count as team members.
operators: []                # e.g. [alice:1234567, bob:7654321]

fix_attempts_max: 2          # fix-agent dispatches per PR before escalating
ci_reruns_max: 1             # flake re-runs per PR per cause

# Optional cross-session messaging (docs/agent-messaging.md in engsys). Omit the
# whole block to keep pure poll-based behavior — messaging is a best-effort
# latency layer and correctness never depends on a message arriving.
# messaging:
#   session_name: <ns>-mm         # this session's addressable --name (e.g. acme-mm)
#   notify_author: true           # nudge the handoff `session:` on bounce/escalate/merge
#   namespace_prefix: <ns>-       # only address / trust names with this prefix (the namespace fence)
#   inbound: accept               # required crossSessionInbound value for an autonomous session
#   operator_slack:               # DEPRECATED, ignored: Slack replies no longer grant decisions
#     enabled: false              # (approval happens in GitHub; see operators_team). Removed next release.

# Optional subagent liveness (docs/subagent-liveness.md in engsys; scripts
# mm-agent-reg.sh + mm-agent-watch.sh in this skill's scripts/). Registry row +
# per-class deadline on every spawn; watchdog Monitor emits AGENT_OVERDUE /
# AGENT_STALE; probe before declaring death; fence before respawn. Omit the
# block to run without the watchdog (spawn discipline still recommended).
# liveness:
#   stale_minutes: 10             # transcript-silence threshold for AGENT_STALE
#   stale_probe: true             # STALE alone is probe-worthy; only OVERDUE mounts the ladder
#   deadline_minutes:             # per task class; expiry triggers a PROBE, never execution
#     default: 30
#     rebase: 10
#     review: 30
#     fix: 45
#     dependabot_gate: 30
#   extension_max: 1              # one journalled extension, then the ladder
#   respawn_max: 2                # generations per unit before escalate
#   probe_retry_minutes: 5        # failed probe ≠ death: bounded retries…
#   probe_retries_max: 2          # …then classify only on independent evidence
