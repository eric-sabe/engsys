name: Secret Scan

# Non-bypassable secret-scanning backstop. A pre-commit hook (husky/pre-commit
# in this template set) runs gitleaks locally for early feedback, but a hook is
# defeated by `git commit --no-verify`. This CI job is the layer that cannot be
# skipped.
#
# It runs the gitleaks CLI (MIT licence, no key needed) from its official
# container image, NOT gitleaks/gitleaks-action, whose licence requirement
# applies to organisation-owned repos. If your repo already has GitHub-native
# secret scanning / push protection, this is still a cheap second layer.
#
# Adopt: keep the job name `gitleaks` stable if you make it a required check;
# change `main` below if your default branch is named differently; put narrow
# allowlist entries (path or regex) in a repo-root `.gitleaks.toml`, which
# gitleaks auto-detects.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Supersede stale PR scans, but never cancel a push scan: each push covers a
  # distinct commit range, so a cancelled push run would leave its range
  # unscanned. Push runs get a per-SHA group; they queue rather than cancel.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the job only needs to read the repo to scan it.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        # Verify these pins and keep them current (Dependabot can bump them).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed so the range scan below can resolve the base
          # commit (PR base / push `before`); a shallow clone would not have it.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan range
        # Scan ONLY the commits the triggering event introduces, not the whole
        # history. Secrets that already exist in older history (tracked for
        # rotation elsewhere) would otherwise be re-flagged on every run
        # forever. Add a separate scheduled full-history sweep if you want one.
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          # A brand-new branch's first push (or a deleted-ref event) reports an
          # all-zeroes `before`. With no resolvable base, fall back to scanning
          # just the tip commit (HEAD~1..HEAD).
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO_SHA" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No resolvable base commit; scanning tip commit only."
            if git rev-parse --verify --quiet "${HEAD}~1" >/dev/null; then
              BASE="${HEAD}~1"
            else
              # The repo's first commit: scan the whole (tiny) history.
              BASE="$(git rev-list --max-parents=0 "$HEAD" | tail -n 1)"
            fi
          fi

          echo "Scanning range: ${BASE}..${HEAD}"
          echo "log_opts=${BASE}..${HEAD} --no-merges" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks
        # The official GHCR image; pin a version and bump it deliberately.
        # `--log-opts` restricts the scan to the event's commit range only. The
        # range comes through env, not inline expansion, so it never reaches the
        # shell parser as template text. The step fails on any finding
        # (`--exit-code 1`); `--redact` keeps secret values out of the log.
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --exit-code 1 \
              --log-opts="$LOG_OPTS" \
              --report-format sarif --report-path /repo/gitleaks-report.sarif

      - name: Upload gitleaks report
        # Keep the SARIF as a build artifact for triage even when the scan
        # passes. (It is not uploaded to GitHub code scanning, which needs
        # Advanced Security; the artifact is the no-subscription equivalent.)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 14
          if-no-files-found: ignore
