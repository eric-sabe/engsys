# engsys project config — copy to your project root as engsys.config.yaml,
# edit, then run:  /path/to/engsys/install install --into .
#
# This file is the single source of truth for what the installer materializes.
# Block lists must be indented under their key (see hook_patterns below).

project:
  name: Acme Widgets
  description: One-line description rendered into CLAUDE.md.

# Agent harness target: claude (default) | copilot | antigravity | all
harness: claude

# Every stack dimension accepts a single value OR a list — mixed stacks compose
# (each selected pack contributes its skills, CLAUDE.md fragment, and permissions).
stack:
  cloud: aws            # aws | azure | gcp | cloudflare | none   — or a list: [azure, cloudflare]
  iac: terraform        # terraform | bicep | cdk | none          — or a list
  lang: [typescript]    # typescript | python | swift | kotlin | shell
  platform: [web]       # web | ios | android                    — e.g. [web, ios, android]
  db: none              # prisma | mongo | none                   — or a list: [prisma, mongo]
  # domain: [mobile-growth]   # optional extra packs under stacks/domain/

# Issue tracker (PRs / CI always stay on GitHub — this is a separate axis).
issue_tracker: github   # github | linear | jira

# Worker providers (docs/multi-provider-spec.md). Each enabled worker selects
# stacks/tooling/provider-<name>/ and renders into .claude/scripts/providers.json
# (machine-readable routing) + a CLAUDE.md table. No block = no worker layer.
# Enable a worker by flipping `enabled: true`; models are per-role defaults that
# worker-run --model can override per dispatch (e.g. Sol/Pro escalation).
providers:
  conductor: anthropic
  workers:
    codex:
      enabled: false
      models:
        implement: gpt-6.1-sol
        review: gpt-6-astra
        critique: gpt-6-astra
        investigate: gpt-6.1-sol
    deepseek:
      enabled: false          # requires DEEPSEEK_API_KEY in the environment
      models:
        implement: deepseek-flash
        review: deepseek-v4-pro
        critique: deepseek-v4-pro
        investigate: deepseek-v4-pro
    grok:
      enabled: false          # review/critique/investigate lane only
      via: auto               # cli (Grok Build subscription) | api (XAI_API_KEY, metered) | auto (prefer cli)
      models:
        review: grok-4.7
        critique: grok-4.7
        investigate: grok-4.7
    anthropic:
      enabled: false          # explicit worker lane (fresh claude session), review-chain terminal fallback
      models:
        implement: sonnet
        review: opus
        critique: opus
        investigate: sonnet
  routing:
    implement_default: codex
    review: cross_family      # hard rule: reviewer family ≠ author family
    review_fallback_chain: [codex, grok, deepseek, anthropic]  # walked minus the author's family
    overflow: deepseek
    critique: grok
  parallel:
    enabled: false            # stays false until the spec § 8.3 preconditions pass
    max_workers: 3
    require_nonoverlapping_touches: true
  timeouts:                   # seconds, per role
    implement: 3600
    review: 2700

agents:
  core: all             # 'all' or an explicit list, e.g. [melvin, isabelle, bert] — includes gary (design critic)
  extra: [sandy]        # opt-in personas from optional-agents/ (sandy, jos, steve, deandre)

commands: all           # 'all' or an explicit list

lessons:
  seed: true                      # seed the universal lessons-library into the project
  into: docs/agent-lessons/library  # where seeded lessons land (project-local lessons stay at docs/agent-lessons/)

naturalize:
  model_strategy: "Four tiers + security carve-out: Sonnet 5.5 (claude-sonnet-5-5) for execution; Opus 5.5 (claude-opus-5-5) for orchestration and judgement; escalate to Fable 5.1 (claude-fable-5-1) for the hardest architecture/concurrency/migration cases; Haiku 5.5 (claude-haiku-5-5) for fast probes; and Opus 4.8 (claude-opus-4-8) pinned for Nyx and security work."
  hook_patterns:
    - glob: "*/schema.prisma"
      reminder: "Schema changed — regenerate the client and rebuild dependents before pushing."
    - glob: "docs/vision-and-spec.md"
      reminder: "Bump the version/date header; keep docs cross-refs in sync."
  invariants: []        # project hard rules appended to CLAUDE.md project facts
  # project_facts: |     # optional; otherwise the installer leaves a TODO marker
  #   Multi-line project facts can go here.

# Optional per-tier model overrides (defaults adapt automatically to `harness:`):
# - claude:      judgement=opus, execution=sonnet, security=claude-opus-4-8, escalation=fable, fast=haiku
#                (pinned in fleet.conf to claude-opus-5-5, claude-sonnet-5-5, claude-opus-4-8, claude-fable-5-1, claude-haiku-5-5)
# - copilot:     judgement=claude-opus-5.5, execution=claude-sonnet-5.5, security=claude-opus-4.8, fast=claude-haiku-5.5
#                (or swap to OpenAI/Google: e.g. judgement=gpt-6-astra, execution=gpt-6.1-sol, fast=gpt-6-luna, or gemini-4-argon / gemini-3.8-flash)
# - antigravity: judgement=gemini-4-argon, execution=gemini-4-argon, security=gemini-4-argon, escalation=gemini-4-argon, fast=gemini-3.8-flash
#                (Gemini 4 Argon is the premier model scaled via `effort: medium|high|max`; Gemini 3.8 Flash is the smaller/faster model)
# models:
#   judgement: claude-opus-5.5
#   execution: claude-sonnet-5.5
#   security: claude-opus-4.8
#   escalation: claude-opus-5.5
#   fast: claude-haiku-5.5

# Cross-session & cross-fleet messaging (docs/agent-messaging.md, docs/multi-fleet.md).
# For Claude Code (>= 2.1.232), sets `crossSessionInbound` in .claude/settings.local.json
# so autonomous or named sessions (`claude --name <namespace>-<role> --remote-control`)
# accept peer nudges (`SendMessage` / `ListAgents`) without hanging on an approval dialog.
# Cross-fleet messaging (`fleet msg` / `fleet relay` / `fleet-inbox.mjs`) works across
# all harnesses (`claude`, `copilot`, `antigravity`) via GitHub App-verified comments.
# messaging:
#   enabled: true
#   namespace: acme           # session name prefix (<namespace>-<role>, e.g. acme-mm, acme-build)
#   inbound: accept           # accept | hold | refuse (`accept` required for unattended monsters)
#   remote_control: true      # recommend --remote-control on launched sessions

engsys:
  version: main         # tag / branch / commit the project was installed from
